<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medical Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <h2>Medical Chatbot</h2>
        <div id="chatBox"></div>
        <div id="loading">Initializing chatbot... Please wait.</div>
        <input type="text" id="userInput" placeholder="Type your message..." />
        <button id="sendBtn">Send</button>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const loading = document.getElementById('loading');

        async function sendMessage() {
            const msg = userInput.value.trim();
            if (!msg) return;

            chatBox.innerHTML += `<div class="chat-message user"><strong>You:</strong> ${msg}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
            userInput.value = '';

            loading.style.display = 'block';

            const formData = new FormData();
            formData.append('msg', msg);

            try {
                const response = await fetch('/chat', { method: 'POST', body: formData });
                const answer = await response.text();
                chatBox.innerHTML += `<div class="chat-message bot"><strong>Bot:</strong> ${answer}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                chatBox.innerHTML += `<div class="chat-message bot"><strong>Bot:</strong> Error: ${err}</div>`;
            } finally {
                loading.style.display = 'none';
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
